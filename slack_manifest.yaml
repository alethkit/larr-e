# Create the Slack app from this manifest: https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: LARR-E
  description: Talk to your Pioreactor cluster. Alerts, plots and approved hardware actions.
  background_color: "#0f766e"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: LARR-E
    always_online: true
  slash_commands:
    - command: /larr-e
      description: Ask LARR-E or request a lab action
      usage_hint: "status | alerts | plot the last 10 minutes of OD against temperature"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - files:write
      - groups:history
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
